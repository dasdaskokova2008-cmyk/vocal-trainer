version: '3.8'

services:
  php:
    build:
      context: ./docker/php
    container_name: vocal-trainer-php
    working_dir: /var/www
    volumes:
      - ./app:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini
    environment:
      - APP_ENV=prod
      - APP_DEBUG=0
      - DATABASE_URL=mysql://vocal_user:vocal_pass@db:3306/vocal_db
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: vocal-trainer-nginx
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php

  db:
    image: mysql:8.0
    container_name: vocal-trainer-db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: vocal_db
      MYSQL_USER: vocal_user
      MYSQL_PASSWORD: vocal_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
  cron:
    build:
      context: ./docker/cron
    container_name: vocal-trainer-cron
    volumes:
      - ./app:/var/www
    depends_on:
      - php
    restart: unless-stopped

volumes:
  db_data: