services:
    _defaults:
        autowire: true  
        autoconfigure: true 
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'
    App\EventListener\CacheControlListener:
        tags:
            - { name: kernel.event_listener, event: kernel.response }
            