framework:
    secret: '%env(APP_SECRET)%'
    session: true
    router:
        utf8: true
    default_locale: ru
    http_method_override: false
    handle_all_throwables: true
    php_errors:
        log: true
    assets:
        version: '1.0'
    cache:
        app: cache.adapter.filesystem
        system: cache.adapter.filesystem
        directory: '%kernel.cache_dir%/pools'